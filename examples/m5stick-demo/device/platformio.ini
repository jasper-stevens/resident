[platformio]
default_envs = m5stick

[env]
platform = espressif32@6.12.0
framework = arduino
lib_deps =
    ; resident: symlink to in-tree source. CI has no SSH key for this private repo.
    symlink://../../..
    ; PIO quirk: symlinking a parent that contains this project suppresses PIO's
    ; auto-scan of our own lib/, so lib/drivers/M5StickDrivers vanishes. Re-add it.
    symlink://lib/drivers
    git+https://github.com/inanimate-tech/courier.git
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    m5stack/M5Unified
monitor_speed = 115200
extra_scripts = pre:embed_field_recorder.py
; Resident headers use std::optional (C++17). arduino-espressif32 6.12
; defaults to gnu++11, so override at the env level.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -I$PROJECT_DIR/src

[env:m5stick]
board = m5stick-c
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
    ${env.build_flags}
    -DBOARD_M5STICK_C_PLUS2

[env:m5sticks3]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
board_upload.require_upload_port = true
upload_speed = 460800
lib_deps =
    ${env.lib_deps}
    M5PM1=https://github.com/m5stack/M5PM1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_M5STICKS3
upload_resetmethod = no_reset

; First flash from factory UiFlow2 firmware: 1200-baud touch won't work.
; Hold Btn A, tap power button, release Btn A, then upload this env.
[env:m5sticks3-firstflash]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
upload_speed = 460800
upload_flags =
    --before=no_reset
    --after=hard_reset
lib_deps =
    ${env.lib_deps}
    M5PM1=https://github.com/m5stack/M5PM1
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_M5STICKS3
upload_resetmethod = no_reset
